<body class="loading-side loading-map" data-game="botw">
<div id="app">
  <aside id="side" aria-label="Filters and progress">
    <header class="side-head">
      <div class="title-row">
        <h1 id="game-title">Map</h1>
        <a class="home-link" href="../../">All maps</a>
      </div>
      <div class="progress">
        <div class="progress-num"><span id="found-count">0</span><span class="of"> of </span><span id="total-count">0</span></div>
        <div id="progress-bar" class="bar" role="img" aria-label="Progress by group"></div>
      </div>
      <div class="profile-row">
        <label class="field">
          <span>Profile</span>
          <select id="profile-select"></select>
        </label>
        <button id="profile-menu-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" title="Profile actions">&#8943;</button>
        <div id="profile-menu" class="menu" hidden>
          <button data-act="new">New profile</button>
          <button data-act="rename">Rename</button>
          <button data-act="reset">Clear found markers</button>
          <button data-act="delete" class="danger">Delete profile</button>
          <hr>
          <button data-act="export">Export progress</button>
          <button data-act="import">Import progress</button>
        </div>
      </div>
      <div class="tag-row" id="tag-row">
        <label class="field" id="tag-field">
          <span id="tag-label">Difficulty</span>
          <select id="tag-select"></select>
        </label>
        <button type="button" class="tag-strict" id="tag-strict" aria-pressed="false" aria-label="Show only markers with this tag" data-tip="Show only markers with this tag"><span class="knob"></span></button>
      </div>
      <div class="profile-row preset-row">
        <label class="field">
          <span>Selection preset</span>
          <div class="picker">
            <select id="preset-select"></select>
            <span id="preset-status" class="dot preset-status" aria-hidden="true" hidden></span>
          </div>
        </label>
        <button id="preset-menu-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" title="Preset actions">&#8943;</button>
        <div id="preset-menu" class="menu" hidden>
          <button data-act="save">Save as new preset</button>
          <button data-act="rename" data-needs-preset>Rename</button>
          <button data-act="delete" data-needs-preset class="danger">Delete preset</button>
        </div>
      </div>
      <div id="preset-bar" class="preset-bar" hidden>
        <span class="preset-note">Changed from the saved preset</span>
        <button data-act="revert" class="chip">Revert</button>
        <button data-act="overwrite" class="chip primary">Overwrite</button>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Search locations" autocomplete="off" aria-label="Search locations">
        <ul id="results" hidden></ul>
      </div>
    </header>
    <div class="list-tools">
      <button id="show-all" class="link-btn">Show all</button>
      <button id="hide-all" class="link-btn">Hide all</button>
      <label class="check"><input type="checkbox" id="hide-found"><span>Hide found</span></label>
      <button id="side-close" class="link-btn mobile-only">Close</button>
    </div>
    <div id="groups" class="groups"></div>
  </aside>

  <main id="stage">
    <div id="map" class="tools-collapsed" aria-label="Map"></div>
    <button id="side-toggle" class="fab" aria-controls="side" aria-label="Filters" title="Filters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button id="side-collapse" class="side-collapse" aria-controls="side" aria-expanded="true" title="Hide panel" aria-label="Hide panel">&#171;</button>
    <section id="detail" aria-live="polite" hidden>
      <div class="d-tools">
        <button id="detail-back" class="icon-btn" aria-label="Back" title="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button id="detail-close" class="icon-btn" aria-label="Close" title="Close">&times;</button>
      </div>
      <div id="detail-body"></div>
    </section>
  </main>
</div>

<div id="lightbox" hidden><img alt=""></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json" hidden>
